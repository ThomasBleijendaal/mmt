<!DOCTYPE html>
<html>

<head>
    <title>MMT</title>
    <link rel="icon" href="favicon.png" />
    <style>
        body {
            background: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            position: relative;
            width: 1600px;
            margin: 0 auto;
        }

        .hidden {
            display: none;
        }

        #init-screen {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 900px;
            border: 3px solid gray;
            text-align: center;
            padding: 30px;
        }

        #join-screen {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 900px;
            border: 3px solid gray;
            background: darkgray;
            text-align: center;
            padding: 30px;
        }

        #death-screen {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 900px;
            border: 3px solid red;
            background-color: #800;
            text-align: center;
            padding: 30px;
            text-transform: uppercase;
        }

        #win-screen {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 900px;
            border: 3px solid lime;
            background-color: green;
            text-align: center;
            padding: 30px;
            text-transform: uppercase;
        }

        #inserts {
            position: relative;

            div {
                position: absolute;
                width: 0px;
                height: 0px;
                border-left: 10px solid transparent;
                border-right: 10px solid transparent;
                border-top: 20px solid var(--color);
            }
        }

        #health,
        #rowsCleared {
            font-size: 20px;
        }

        #health {
            float: right;
            padding: 10px;

            div {
                margin-bottom: 10px;

                &::before {
                    float: left;
                    content: " ";
                    display: block;
                    width: 18px;
                    height: 18px;
                    margin: 0px 10px 0 0px;
                    border: 2px solid white;
                    background-color: var(--color);
                }
            }
        }

        ul {
            list-style: none;
        }

        kbd {
            background-color: #eeeeee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgb(0 0 0 / 0.2), 0 2px 0 0 rgb(255 255 255 / 0.7) inset;
            color: #333333;
            display: inline-block;
            font-size: 0.85em;
            font-weight: bold;
            line-height: 1;
            padding: 2px 4px;
            white-space: nowrap;
        }

    </style>
</head>

<body>
    <div id="init-screen">
        <label for="name">Name</label>
        <input name="name" id="name">
        <button id="join">Join</button>
    </div>

    <div id="join-screen" class="hidden">
        <pre id="share-url"></pre>

        <ul>
            <li>Use <kbd>&larr;</kbd> and <kbd>&rarr;</kbd> to move</li>
            <li>Use <kbd>&darr;</kbd> to block</li>
            <li>Use <kbd>&uarr;</kbd> to rotate</li>
            <li>Use <kbd>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</kbd> to smash down</li>
        </ul>

        <button id="ready">READY</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="inserts"></div>

        <canvas id="game" width="961" height="961"></canvas>

        <div id="health"></div>
    </div>

    <div id="death-screen" class="hidden">
        You died
    </div>

    <div id="win-screen" class="hidden">
        You won
    </div>

    <script src="./audio.js"></script>
    <script src="./rendering.js"></script>
    <script src="./game.js"></script>
</body>

</html>
