<!DOCTYPE html>
<html>

<head>
    <title>MMT</title>
    <link rel="icon" href="favicon.png" />
    <style>
        body {
            background: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            position: relative;
        }

        .hidden { display: none; }

        #init-screen
        {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 400px;
            border: 3px solid gray;
            text-align: center;
            padding: 30px;
        }

        #join-screen
        {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 400px;
            border: 3px solid gray;
            background: darkgray;
            text-align: center;
            padding: 30px;
        }

        #death-screen
        {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 400px;
            border: 3px solid red;
            background-color: #800;
            text-align: center;
            padding: 30px;
            text-transform: uppercase;
        }

        #win-screen
        {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 400px;
            border: 3px solid lime;
            background-color: green;
            text-align: center;
            padding: 30px;
            text-transform: uppercase;
        }

        #health,
        #rowsCleared {
            font-size: 20px;
        }

        #health div {
            margin-bottom: 10px;
        }

        #health div::before {
            float: left;
            content: " ";
            display: block;
            width: 18px;
            height: 18px;
            margin: 0px 10px 0 0px;
            border: 2px solid white;
            background-color: var(--color);
        }
    </style>
</head>

<body>
    <div id="init-screen">
        <label for="name">Name</label>
        <input name="name" id="name">
        <button id="join">Join</button>
    </div>

    <div id="join-screen" class="hidden">
        <pre id="share-url"></pre>
        <button id="ready">READY</button>
    </div>

    <div id="game-screen" class="hidden">
        <canvas id="game" width="961" height="961"></canvas>

        <div id="health">
        </div>
    </div>

    <div id="death-screen" class="hidden">
        You died
    </div>

    <div id="win-screen" class="hidden">
        You won
    </div>

    <script src="./rendering.js"></script>
    <script src="./game.js"></script>
</body>

</html>
